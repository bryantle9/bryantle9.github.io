<!DOCTYPE html>
<html lang="en">
<head>

<style>
  :root { --cream: #FBF8F1; --ink: #1E1D19; --ink-soft: #6C6A5F; --line: #E3DECD; --accent: #B44B28; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--cream); color: var(--ink); font-family: 'Work Sans', sans-serif; line-height: 1.6; }
  a { color: inherit; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  nav { position: sticky; top: 0; z-index: 50; background: var(--cream); display: flex; justify-content: space-between; align-items: center; padding: 28px 6vw; }
  .logo { font-family: 'Newsreader', serif; font-weight: 800; font-size: 24px; text-decoration: none; }
  .nav-links { display: flex; gap: 34px; font-size: 15px; }
  .nav-links a { text-decoration: none; }
  .nav-links a:hover, .nav-links a[aria-current] { text-decoration: underline; text-underline-offset: 4px; }

  main { max-width: 880px; margin: 0 auto; padding: 10px 6vw 90px; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin-bottom: 28px; }
  h1 { font-family: 'Newsreader', serif; font-weight: 800; font-size: clamp(40px, 6vw, 60px); line-height: 1; }
  .download { display: inline-block; background: var(--ink); color: var(--cream); text-decoration: none; font-weight: 600; font-size: 15px; padding: 12px 22px; border-radius: 999px; }
  .download:hover { background: var(--accent); }
  .paper { background: #fff; border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 18px 40px rgba(30,29,25,0.08); overflow: hidden; }
  .paper img { display: block; width: 100%; height: auto; }

  /* shared polish */
  h1, h2, h3, .p-title, .name { text-wrap: balance; }
  p, li { text-wrap: pretty; }
  .btn:active, .download:active, .p-link:active, .cta:active { transform: scale(0.97); }
  a.banner:active, .bw-banner:active { transform: scale(0.99); }
  .facts dd, .row { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<nav>
  <a class="logo" href="index.html">b.</a>
  <div class="nav-links">
    <a href="index.html#work">work</a>
    <a href="resume.html" aria-current="page">resume</a>
    <a href="contact.html">contact me</a>
  </div>
</nav>

<main>

    <h1>Resume</h1>

  </div>
  <div class="paper">
    <img src="images/resume.png" alt="Bryant Le's resume. Download the PDF for a text version.">
  </div>
</main>

</body>
</html>
