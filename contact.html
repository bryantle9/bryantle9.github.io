<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Bryant Le</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23C0532D'/%3E%3Ctext x='32' y='45' font-family='Georgia, serif' font-style='italic' font-weight='700' font-size='36' fill='%23FBF8F1' text-anchor='middle'%3Eb.%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;0,700;0,800;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --cream: #FBF8F1; --ink: #1E1D19; --ink-soft: #6C6A5F; --line: #E3DECD; --accent: #C0532D; --glow: #7FB0A0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--cream); color: var(--ink); font-family: 'Work Sans', sans-serif; line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
  a { color: inherit; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  nav { display: flex; justify-content: space-between; align-items: center; padding: 28px 6vw; }
  .logo { font-family: 'Newsreader', serif; font-weight: 800; font-size: 24px; text-decoration: none; }
  .nav-links { display: flex; gap: 34px; font-size: 15px; }
  .nav-links a { text-decoration: none; }
  .nav-links a:hover, .nav-links a[aria-current] { text-decoration: underline; text-underline-offset: 4px; }

  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 6vw 80px; position: relative; overflow: hidden; }
  .glow { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -55%); width: 620px; height: 620px; background: radial-gradient(circle, var(--glow) 0%, rgba(127,176,160,0) 70%); opacity: 0.45; z-index: 0; pointer-events: none; }
  h1 { font-family: 'Newsreader', serif; font-style: italic; font-weight: 800; font-size: clamp(34px, 5vw, 48px); margin-bottom: 30px; position: relative; z-index: 1; }

  .scene { width: min(500px, 88vw); aspect-ratio: 1.75 / 1; perspective: 1600px; position: relative; z-index: 1; }
  .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.7s cubic-bezier(.45,.05,.25,1); will-change: transform; }
  .card.flipped { transform: rotateY(180deg); }
  .card.flipped .front, .card:not(.flipped) .back { pointer-events: none; }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 14px; box-shadow: 0 20px 44px rgba(30,29,25,0.14), 0 2px 6px rgba(30,29,25,0.08); padding: 7% 8%; display: flex; flex-direction: column; }
  .face-btn { all: unset; position: absolute; inset: 0; border-radius: 14px; cursor: pointer; z-index: 1; }

  .front { background: #FFFDF8; border: 1px solid var(--line); color: var(--ink); justify-content: space-between; transform: rotateY(0deg) translateZ(1px); }
  .front::before { content: ""; position: absolute; inset: 10px; border: 1px solid var(--line); border-radius: 8px; pointer-events: none; }
  .front .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .front .name { font-family: 'Newsreader', serif; font-style: italic; font-weight: 800; font-size: clamp(34px, 8vw, 54px); line-height: 1; }
  .front .rule { width: 44px; height: 2px; background: var(--accent); margin: 14px auto 12px; }
  .front .role { font-size: clamp(11px, 2.2vw, 13px); letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .front .foot { display: flex; justify-content: space-between; font-size: clamp(11px, 2vw, 13px); color: var(--ink-soft); }

  .back { background: var(--ink); color: var(--cream); transform: rotateY(180deg) translateZ(1px); justify-content: space-between; }
  .back .top { display: flex; justify-content: space-between; align-items: baseline; }
  .back .mark { font-family: 'Newsreader', serif; font-style: italic; font-weight: 800; font-size: clamp(22px, 4vw, 30px); color: var(--accent); line-height: 1; }
  .back .city { font-size: clamp(11px, 2vw, 13px); opacity: 0.6; }
  .back .rows { display: flex; flex-direction: column; gap: clamp(10px, 3vw, 18px); }
  .back .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: #E59A7C; font-weight: 600; margin-bottom: 2px; }
  .back a { position: relative; z-index: 2; font-size: clamp(15px, 3vw, 19px); text-decoration: none; border-bottom: 1px solid rgba(251,248,241,0.35); padding-bottom: 1px; word-break: break-word; }
  .back a:hover { border-bottom-color: var(--accent); color: #fff; }

  .hint { margin-top: 26px; font-size: 14px; color: var(--ink-soft); position: relative; z-index: 1; min-height: 1.6em; }
  .hint, .under { text-align: center; }
  .under { margin-top: 6px; font-size: 14px; color: var(--ink-soft); position: relative; z-index: 1; }

  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>

<nav>
  <a class="logo" href="index.html">b.</a>
  <div class="nav-links">
    <a href="index.html#work">work</a>
    <a href="resume.html">resume</a>
    <a href="contact.html" aria-current="page">contact me</a>
  </div>
</nav>

<main>
  <div class="glow"></div>
  <h1>Let's talk.</h1>

  <div class="scene">
    <div class="card" id="card">
      <div class="face front" id="front">
        <button class="face-btn" id="flip" aria-label="Flip the card to see my email and LinkedIn"></button>
        <div class="center">
          <div class="name">bryant le</div>
          <div class="rule"></div>
          <div class="role">UX design and data</div>
        </div>
        <div class="foot"><span>Informatics, UW iSchool</span><span>bryantle.net</span></div>
      </div>

      <div class="face back" id="back" aria-hidden="true">
        <button class="face-btn" id="unflip" tabindex="-1" aria-label="Flip the card back"></button>
        <div class="top"><span class="mark">b.</span><span class="city">Seattle, WA</span></div>
        <div class="rows">
          <div>
            <div class="label">Email</div>
            <a href="mailto:bryantle2000@gmail.com" tabindex="-1">bryantle2000@gmail.com</a>
          </div>
          <div>
            <div class="label">LinkedIn</div>
            <a href="https://www.linkedin.com/in/le-bryant" target="_blank" rel="noopener" tabindex="-1">linkedin.com/in/le-bryant</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <p class="hint" id="hint">Tap the card to flip it &#8635;</p>
  <p class="under">Open to UX and data internships for summer 2027.</p>
</main>

<script>
  const card = document.getElementById('card');
  const back = document.getElementById('back');
  const front = document.getElementById('front');
  const flip = document.getElementById('flip');
  const unflip = document.getElementById('unflip');
  const hint = document.getElementById('hint');
  const backFocusables = back.querySelectorAll('a, button');

  function setFlipped(on) {
    card.classList.toggle('flipped', on);
    back.setAttribute('aria-hidden', String(!on));
    front.setAttribute('aria-hidden', String(on));
    flip.tabIndex = on ? -1 : 0;
    backFocusables.forEach(el => { el.tabIndex = on ? 0 : -1; });
    hint.innerHTML = on ? 'Tap the card again to flip it back &#8634;' : 'Tap the card to flip it &#8635;';
    (on ? back.querySelector('a') : flip).focus({ preventScroll: true });
  }
  flip.addEventListener('click', () => setFlipped(true));
  unflip.addEventListener('click', () => setFlipped(false));
</script>

</body>
</html>
