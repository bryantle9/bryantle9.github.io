<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Bryant Le</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23C0532D'/%3E%3Ctext x='32' y='45' font-family='Georgia, serif' font-style='italic' font-weight='700' font-size='36' fill='%23FBF8F1' text-anchor='middle'%3Eb.%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;0,700;0,800;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --cream: #FBF8F1; --ink: #1E1D19; --ink-soft: #6C6A5F; --line: #E3DECD; --accent: #B44B28; --glow: #7FB0A0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--cream); color: var(--ink); font-family: 'Work Sans', sans-serif; line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
  a { color: inherit; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  nav { display: flex; justify-content: space-between; align-items: center; padding: 28px 6vw; }
  .logo { font-family: 'Newsreader', serif; font-weight: 800; font-size: 24px; text-decoration: none; }
  .nav-links { display: flex; gap: 34px; font-size: 15px; }
  .nav-links a { text-decoration: none; }
  .nav-links a:hover, .nav-links a[aria-current] { text-decoration: underline; text-underline-offset: 4px; }

  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 6vw 80px; position: relative; overflow: hidden; }
  .glow { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -55%); width: 620px; height: 620px; background: radial-gradient(circle closest-side, var(--glow) 0%, rgba(127,176,160,0) 100%); opacity: 0.45; z-index: 0; pointer-events: none; }
  h1 { font-family: 'Newsreader', serif; font-style: italic; font-weight: 800; font-size: clamp(34px, 5vw, 48px); margin-bottom: 30px; position: relative; z-index: 1; }

  .scene { width: min(540px, 90vw); aspect-ratio: 1.75 / 1; perspective: 1200px; position: relative; z-index: 1; }
  .card { width: 100%; height: 100%; border-radius: 6px; background: #F3EEE2; background-image: radial-gradient(rgba(120,100,70,0.05) 1px, transparent 1px); background-size: 3px 3px; box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset, 0 22px 46px rgba(30,29,25,0.16), 0 3px 8px rgba(30,29,25,0.10); padding: 6.5% 7.5%; display: flex; flex-direction: column; justify-content: space-between; color: #2A2823; transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform 0.25s ease-out; will-change: transform; }
  .raised { text-shadow: 0 1px 0 rgba(255,255,255,0.85), 0 -0.5px 0 rgba(0,0,0,0.12); }
  .row { display: flex; justify-content: space-between; font-size: clamp(10px, 1.9vw, 12.5px); letter-spacing: 0.06em; }
  .center { text-align: center; }
  .name { font-family: 'Newsreader', serif; font-weight: 600; font-size: clamp(22px, 5vw, 34px); letter-spacing: 0.22em; text-transform: uppercase; margin-right: -0.22em; }
  .title { font-family: 'Newsreader', serif; font-style: italic; font-size: clamp(13px, 2.6vw, 17px); margin-top: 6px; color: #4A473F; }
  .focus { font-size: clamp(10px, 1.8vw, 12px); letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-top: 8px; font-weight: 600; }
  .card a { text-decoration: none; border-bottom: 1px solid rgba(42,40,35,0.25); }
  .card a:hover { color: var(--accent); border-bottom-color: var(--accent); }

  .actions { display: flex; gap: 12px; margin-top: 30px; position: relative; z-index: 1; flex-wrap: wrap; justify-content: center; }
  .btn { font: inherit; font-size: 15px; font-weight: 600; padding: 11px 20px; border-radius: 999px; text-decoration: none; cursor: pointer; border: 1.5px solid var(--ink); background: var(--ink); color: var(--cream); }
  .btn.ghost { background: transparent; color: var(--ink); }
  .btn:hover { background: var(--accent); border-color: var(--accent); color: var(--cream); }
  @media (max-width: 480px) { .actions { gap: 8px; } .btn { font-size: 14px; padding: 9px 14px; } }
  .btn.ok { animation: pulse 0.45s cubic-bezier(.16,1,.3,1); background: var(--ink); color: var(--cream); }
  @keyframes pulse { 0% { transform: scale(1); } 40% { transform: scale(1.06); } 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .btn.ok { animation: none; } }
  .under { margin-top: 18px; font-size: 14px; color: var(--ink-soft); position: relative; z-index: 1; text-align: center; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  @media (prefers-reduced-motion: reduce) { .card { transition: none; transform: none !important; } }

  /* shared polish */
  h1, h2, h3, .p-title, .name { text-wrap: balance; }
  p, li { text-wrap: pretty; }
  .btn:active, .download:active, .p-link:active, .cta:active { transform: scale(0.97); }
  a.banner:active, .bw-banner:active { transform: scale(0.99); }
  .facts dd, .row { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<nav>
  <a class="logo" href="index.html">b.</a>
  <div class="nav-links">
    <a href="index.html#work">work</a>
    <a href="resume.html">resume</a>
    <a href="contact.html" aria-current="page">contact me</a>
  </div>
</nav>

<main>
  <div class="glow"></div>
  <h1 class="sr">Contact Bryant Le</h1>

  <div class="scene" id="scene">
    <div class="card" id="card">
      <div class="row raised"><span>Seattle, WA</span><span><a href="index.html">bryantle.net</a></span></div>
      <div class="center raised">
        <div class="name">Bryant Le</div>
        <div class="title">Informatics, University of Washington</div>
        <div class="focus">UX design and data</div>
      </div>
      <div class="row raised"><a href="mailto:bryantle2000@gmail.com">bryantle2000@gmail.com</a><a href="https://www.linkedin.com/in/le-bryant" target="_blank" rel="noopener">linkedin.com/in/le-bryant</a></div>
    </div>
  </div>

  <div class="actions">
    <a class="btn" href="mailto:bryantle2000@gmail.com">Email me</a>
    <button class="btn ghost" id="copy" type="button">Copy email</button>
    <a class="btn ghost" href="https://www.linkedin.com/in/le-bryant" target="_blank" rel="noopener">LinkedIn</a>
  </div>
  <p class="under">Open to UX and data internships for summer 2027.</p>
  <p class="sr" id="status" aria-live="polite"></p>
</main>

<script>
  const card = document.getElementById('card');
  const scene = document.getElementById('scene');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce && window.matchMedia('(hover: hover)').matches) {
    scene.addEventListener('mousemove', e => {
      const r = scene.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
      card.style.setProperty('--ry', (x * 10).toFixed(2) + 'deg');
      card.style.setProperty('--rx', (-y * 10).toFixed(2) + 'deg');
    });
    scene.addEventListener('mouseleave', () => { card.style.setProperty('--ry', '0deg'); card.style.setProperty('--rx', '0deg'); });
  }
  const copy = document.getElementById('copy'), status = document.getElementById('status');
  copy.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText('bryantle2000@gmail.com'); copy.textContent = 'Copied!'; copy.classList.add('ok'); status.textContent = 'Email copied'; }
    catch (e) { copy.textContent = 'bryantle2000@gmail.com'; }
    setTimeout(() => { copy.textContent = 'Copy email'; copy.classList.remove('ok'); }, 2000);
  });
</script>

</body>
</html>
