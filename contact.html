<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Bryant Le</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23C0532D'/%3E%3Ctext x='32' y='45' font-family='Georgia, serif' font-style='italic' font-weight='700' font-size='36' fill='%23FBF8F1' text-anchor='middle'%3Eb.%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;0,700;0,800;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --cream: #FBF8F1; --ink: #1E1D19; --ink-soft: #6C6A5F; --line: #E3DECD; --accent: #C0532D; --glow: #7FB0A0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--cream); color: var(--ink); font-family: 'Work Sans', sans-serif; line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
  a { color: inherit; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  nav { display: flex; justify-content: space-between; align-items: center; padding: 28px 6vw; }
  .logo { font-family: 'Newsreader', serif; font-weight: 800; font-size: 24px; text-decoration: none; }
  .nav-links { display: flex; gap: 34px; font-size: 15px; }
  .nav-links a { text-decoration: none; }
  .nav-links a:hover, .nav-links a[aria-current] { text-decoration: underline; text-underline-offset: 4px; }

  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 6vw 80px; position: relative; overflow: hidden; }
  .glow { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -55%); width: 620px; height: 620px; background: radial-gradient(circle, var(--glow) 0%, rgba(127,176,160,0) 70%); filter: blur(14px); opacity: 0.45; z-index: 0; pointer-events: none; }
  h1 { font-family: 'Newsreader', serif; font-style: italic; font-weight: 800; font-size: clamp(34px, 5vw, 48px); margin-bottom: 30px; position: relative; z-index: 1; }

  .scene { width: min(520px, 88vw); aspect-ratio: 1.75 / 1; perspective: 1400px; position: relative; z-index: 1; }
  .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(.2,.7,.2,1); }
  .card.flipped { transform: rotateY(180deg); }
  .card.flipped .front, .card:not(.flipped) .back { pointer-events: none; visibility: hidden; transition: visibility 0s 0.4s; }
  .card.flipped .back, .card:not(.flipped) .front { visibility: visible; transition: visibility 0s 0.4s; }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 16px; box-shadow: 0 24px 50px rgba(30,29,25,0.16), 0 3px 8px rgba(30,29,25,0.08); padding: 7% 8%; display: flex; flex-direction: column; }
  .front { background: var(--ink); color: var(--cream); justify-content: space-between; }
  .back { background: #FFFDF8; border: 1px solid var(--line); transform: rotateY(180deg); justify-content: center; gap: 6%; }

  .flip-btn { all: unset; position: absolute; inset: 0; border-radius: 16px; cursor: pointer; z-index: 2; }
  .front .mark { font-family: 'Newsreader', serif; font-style: italic; font-weight: 800; font-size: clamp(26px, 5vw, 38px); color: var(--accent); line-height: 1; }
  .front .name { font-family: 'Newsreader', serif; font-style: italic; font-weight: 800; font-size: clamp(32px, 7vw, 54px); line-height: 1; }
  .front .role { font-size: clamp(13px, 2.2vw, 16px); opacity: 0.75; margin-top: 8px; }
  .front .hint { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.55; align-self: flex-end; }

  .back .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); font-weight: 600; margin-bottom: 2px; }
  .back a { font-size: clamp(15px, 2.8vw, 20px); text-decoration: underline; text-underline-offset: 4px; position: relative; z-index: 3; word-break: break-word; }
  .back a:hover { color: var(--accent); }
  .back .flip-back { all: unset; position: absolute; top: 6%; right: 6%; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); cursor: pointer; z-index: 3; }
  .back .flip-back:hover { color: var(--ink); }

  .under { margin-top: 26px; font-size: 14px; color: var(--ink-soft); position: relative; z-index: 1; }

  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>

<nav>
  <a class="logo" href="index.html">b.</a>
  <div class="nav-links">
    <a href="index.html#work">work</a>
    <a href="resume.html">resume</a>
    <a href="contact.html" aria-current="page">contact me</a>
  </div>
</nav>

<main>
  <div class="glow"></div>
  <h1>Let's talk.</h1>

  <div class="scene">
    <div class="card" id="card">
      <div class="face front" id="front">
        <button class="flip-btn" id="flip" aria-label="Flip the card to see my email and LinkedIn"></button>
        <div class="mark">b.</div>
        <div>
          <div class="name">bryant le</div>
          <div class="role">Informatics student at the University of Washington iSchool</div>
        </div>
        <div class="hint">Tap to flip &#8635;</div>
      </div>

      <div class="face back" id="back" aria-hidden="true">
        <button class="flip-back" id="unflip" tabindex="-1">&#8634; Flip back</button>
        <div>
          <div class="label">Email</div>
          <a href="mailto:bryantle2000@gmail.com" tabindex="-1">bryantle2000@gmail.com</a>
        </div>
        <div>
          <div class="label">LinkedIn</div>
          <a href="https://www.linkedin.com/in/le-bryant" target="_blank" rel="noopener" tabindex="-1">linkedin.com/in/le-bryant</a>
        </div>
      </div>
    </div>
  </div>

  <p class="under">Open to UX and data internships for summer 2027.</p>
</main>

<script>
  const card = document.getElementById('card');
  const back = document.getElementById('back');
  const front = document.getElementById('front');
  const flip = document.getElementById('flip');
  const unflip = document.getElementById('unflip');
  const backFocusables = back.querySelectorAll('a, button');

  function setFlipped(on) {
    card.classList.toggle('flipped', on);
    back.setAttribute('aria-hidden', String(!on));
    front.setAttribute('aria-hidden', String(on));
    flip.tabIndex = on ? -1 : 0;
    backFocusables.forEach(el => { el.tabIndex = on ? 0 : -1; });
    (on ? backFocusables[1] : flip).focus({ preventScroll: true });
  }
  flip.addEventListener('click', () => setFlipped(true));
  unflip.addEventListener('click', () => setFlipped(false));
</script>

</body>
</html>
